[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulmoscan"
version = "0.1.0"
description = "Educational chest X-ray tuberculosis classification project"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "tensorflow==2.16.2",
  "pandas>=2.1,<3",
  "numpy>=1.26,<2",
  "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
