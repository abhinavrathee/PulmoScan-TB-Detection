<svg xmlns="http://www.w3.org/2000/svg" width="470" height="104" viewBox="0 0 470 104" role="img" aria-labelledby="title description">
  <title id="title">PulmoScan</title>
  <desc id="description">PulmoScan chest X-ray research logo with a stylized lung and scan-line mark.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54D6E8"/>
      <stop offset="1" stop-color="#54E0B5"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49C6E5"/>
      <stop offset="1" stop-color="#39D4AE"/>
    </linearGradient>
  </defs>

  <!-- Rounded radiology tile -->
  <rect x="8" y="10" width="84" height="84" rx="25" fill="#10233D"/>
  <path d="M25 33V25h9M75 25h9v9M84 71v9h-9M34 80h-9v-9" fill="none" stroke="#36516F" stroke-width="2" stroke-linecap="round"/>

  <!-- Trachea and simplified lung contours -->
  <path d="M50 26v15m0 0-9 8m9-8 9 8" fill="none" stroke="url(#mark)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 44c-2-5-6-6-9-3-5 5-7 14-6 23 1 8 6 13 12 12 6-1 9-7 9-15V50" fill="none" stroke="url(#mark)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 44c2-5 6-6 9-3 5 5 7 14 6 23-1 8-6 13-12 12-6-1-9-7-9-15V50" fill="none" stroke="url(#mark)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scan pulse -->
  <path d="M57 61h5l3-5 4 10 4-6h2" fill="none" stroke="#E7FBFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="111" y="58" fill="#12243A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="43" font-weight="720" letter-spacing="-1.8">
    <tspan>Pulmo</tspan><tspan fill="url(#scan)">Scan</tspan>
  </text>
  <text x="114" y="82" fill="#667A91" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="650" letter-spacing="2.35">CHEST X-RAY RESEARCH</text>
</svg>
